name: Daily 10 AM India Fresher Job Hunter (Full Stack, Frontend & Backend)

on:
  schedule:
    # 04:30 AM UTC = 10:00 AM IST (Indian Standard Time) Every Day
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  hunt-and-mail:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install dependencies
        run: npm install

      - name: 🎯 Run Multi-Track Job Hunter & Send Emails
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 465
          SMTP_SECURE: true
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DEFAULT_LOCATION: India
        run: node run_daily.js
